{% extends "posts/base.html" %}

{% block title %}Lista tematów{% endblock %}

{% block content %}
<h2>Lista tematów</h2>
<ul>
    {% for t in topics %}
        <li>
            <a href="{% url 'topic_detail_html' t.pk %}">{{ t.name }}</a>
            (kategoria: {{ t.category.name }})
        </li>
    {% endfor %}
</ul>
{% endblock %}
