{% extends "posts/base.html" %}

{% block title %}Post: {{ post.title }}{% endblock %}

{% block content %}
<h2>{{ post.title }}</h2>

<p><b>Temat:</b> {{ post.topic.name }}</p>
<p><b>Autor:</b> {{ post.created_by.username }}</p>
<p><b>Data:</b> {{ post.created_at }}</p>

<hr>

<p>{{ post.text }}</p>
{% endblock %}
